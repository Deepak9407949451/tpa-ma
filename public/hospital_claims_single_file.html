    // --- HELPER UTILITIES ---
    function normalizeDateForStorage(dateStr) {
      if (!dateStr) return '';
      const str = String(dateStr).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      
      // Match DD/MM/YYYY or DD-MM-YYYY
      const dmy = str.match(/^(\d{1,2})[/\-.](\d{1,2})[/\-.](\d{4})$/);
      if (dmy) {
        const d = dmy[1].padStart(2, '0');
        const m = dmy[2].padStart(2, '0');
        const y = dmy[3];
        return `${y}-${m}-${d}`;
      }
      return str;
    }

    function formatDateForDisplay(dateStr) {
      if (!dateStr) return '-';
      const norm = normalizeDateForStorage(dateStr);
      if (/^\d{4}-\d{2}-\d{2}$/.test(norm)) {
        const [y, m, d] = norm.split('-');
        return `${d}-${m}-${y}`;
      }
      return dateStr;
    }

    function formatCurrency(val) {
      const n = parseFloat(val) || 0;
      return '₹ ' + n.toLocaleString('en-IN');
    }

    function calculateStayDays(doaStr) {
      if (!doaStr) return 0;
      const normalized = normalizeDateForStorage(doaStr);
      if (!normalized || !/^\d{4}-\d{2}-\d{2}$/.test(normalized)) return 0;
      const [y, m, d] = normalized.split('-').map(Number);
      const admissionDate = new Date(y, m - 1, d);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      admissionDate.setHours(0, 0, 0, 0);
      const diffTime = today.getTime() - admissionDate.getTime();
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      return diffDays >= 0 ? diffDays : 0;
    }

    // --- MAIN APP COMPONENT ---
    function App() {

        try {
          const saved = localStorage.getItem('hospital_claims_data');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return INITIAL_SAMPLE_CLAIMS;
      });

      // Save to localStorage
      useEffect(() => {
        try {
          localStorage.setItem('hospital_claims_data', JSON.stringify(claims));
        } catch (e) {}
      }, [claims]);

      // Filtering & Search
      const [currentFilter, setCurrentFilter] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedIndices, setSelectedIndices] = useState(new Set());
      const [viewMode, setViewMode] = useState('table'); // table or grid

      // Modals State
      const [isFormModalOpen, setIsFormModalOpen] = useState(false);
      const [claimToEdit, setClaimToEdit] = useState(null);
      const [detailsClaim, setDetailsClaim] = useState(null);
      const [showAddressModal, setShowAddressModal] = useState(false);
      const [showInvoiceCalc, setShowInvoiceCalc] = useState(false);
      const [showCoverLetterModal, setShowCoverLetterModal] = useState(false);
      const [coverLetterClaim, setCoverLetterClaim] = useState(null);

      // Hospital Stay Alerts State (> 5 Days Initial Approval)
      const [isStayAlertModalOpen, setIsStayAlertModalOpen] = useState(false);
      const [stayAlertsState, setStayAlertsState] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('hospital_stay_alerts_records') || '{}');
        } catch {
          return {};
        }
      });

      // Calculate Overdue Initial Approval Patients
      const overduePatients = useMemo(() => {
        const now = Date.now();
        return claims
          .map((claim, index) => {
            const statusStr = String(claim.status || '').toLowerCase();
            const isInitial = statusStr === 'initial approved' || statusStr === 'initial approval' || statusStr.includes('initial');
            const isNotDischarged = !claim.dod;
            if (!isInitial || !isNotDischarged) return null;

            const daysStay = calculateStayDays(claim.doa);
            if (daysStay <= 5) return null;

            const patientKey = `${claim.uhid || claim.claimNo || claim.patientName}_${normalizeDateForStorage(claim.doa)}`;
            const rec = stayAlertsState[patientKey];

            // If already marked as 'sent', suppress
            if (rec && rec.status === 'sent') return null;

            // Check if due for reminder (every 2.5 hours if ignored)
            let isDue = true;
            if (rec && rec.status === 'ignored') {
              if (rec.nextReminderAt && now < rec.nextReminderAt) {
                isDue = false;
              }
            }

            return {
              claim,
              claimIndex: index,
              patientKey,
              daysStay,
              isDue
            };
          })
          .filter(Boolean)
          .sort((a, b) => b.daysStay - a.daysStay);
      }, [claims, stayAlertsState]);

      // Auto-trigger stay alert popup if any patient is due
      useEffect(() => {
        const dueItems = overduePatients.filter(p => p.isDue);
        if (dueItems.length > 0) {
          setIsStayAlertModalOpen(true);
        }
      }, [overduePatients]);

      // Recurring timer check every 60 seconds
      useEffect(() => {
        const timer = setInterval(() => {
          const due = overduePatients.some(p => p.isDue);
          if (due) setIsStayAlertModalOpen(true);
        }, 60000);
        return () => clearInterval(timer);
      }, [overduePatients]);

      const handleStaySend = (patientItem, openWhatsApp = false) => {
        const updated = {
          ...stayAlertsState,
          [patientItem.patientKey]: {
            status: 'sent',
            sentAt: Date.now()
          }
        };
        setStayAlertsState(updated);
        localStorage.setItem('hospital_stay_alerts_records', JSON.stringify(updated));

        if (openWhatsApp) {
          const mobile = patientItem.claim.mobileNumber || '';
          const clean = mobile.replace(/\D/g, '');
          const text = `🏥 *HOSPITAL TPA NOTICE - CLINICAL SUMMARY & RUNNING BILL REQUIRED*\n\nPatient Name: ${patientItem.claim.patientName}\nUHID: ${patientItem.claim.uhid}\nClaim No: ${patientItem.claim.claimNo}\nDOA: ${formatDateForDisplay(patientItem.claim.doa)}\nLength of Stay: ${patientItem.daysStay} Days\n\n⚠️ Patient has been admitted for ${patientItem.daysStay} days; clinical summary and running bill required for interim authorization.`;
          window.open(`https://wa.me/${clean ? (clean.startsWith('91') ? clean : '91' + clean) : ''}?text=${encodeURIComponent(text)}`, '_blank');
        }
      };

      const handleStayIgnore = (patientItem) => {
        const updated = {
          ...stayAlertsState,
          [patientItem.patientKey]: {
            status: 'ignored',
            lastIgnoredAt: Date.now(),
            nextReminderAt: Date.now() + 2.5 * 3600 * 1000 // 2.5 hours interval (4 times daily)
          }
        };
        setStayAlertsState(updated);
        localStorage.setItem('hospital_stay_alerts_records', JSON.stringify(updated));
        if (overduePatients.length <= 1) {
          setIsStayAlertModalOpen(false);
        }
      };

      // Summary Statistics Calculation
      const stats = useMemo(() => {
        const totalPatients = claims.length;
        let admitted = 0, initialApproved = 0, discharge = 0, dischargeApproved = 0, denial = 0, pending = 0, settledAmount = 0;
        let totalBill = 0, approved = 0, discount = 0, deduction = 0, patientPay = 0;

        claims.forEach(c => {
          const st = (c.status || '').trim();
          if (st === 'Admitted') admitted++;
          else if (st === 'Initial Approved') initialApproved++;
          else if (st === 'Discharge') discharge++;
          else if (st === 'Discharge Approved') dischargeApproved++;
          else if (st === 'Denial') denial++;
          else if (st === 'Pending') pending++;

          totalBill += parseFloat(c.totalBill) || 0;
          approved += parseFloat(c.approved) || 0;
          discount += parseFloat(c.discount) || 0;
          deduction += parseFloat(c.deduction) || 0;
          patientPay += parseFloat(c.patientPay) || 0;
          if (st === 'Settled') settledAmount += parseFloat(c.deduction || c.approved) || 0;
        });

        return {
          totalPatients, admitted, initialApproved, discharge, dischargeApproved, denial, pending,
          settledAmount, totalBill, approved, discount, deduction, patientPay
        };
      }, [claims]);

      // Filtered Claims
      const filteredClaims = useMemo(() => {
        return claims.filter(c => {
          if (currentFilter && c.status !== currentFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            return Object.values(c).some(val => String(val || '').toLowerCase().includes(q));
          }
          return true;
        });
      }, [claims, currentFilter, searchQuery]);

      // Export to CSV
      const handleExportCSV = () => {
        if (filteredClaims.length === 0) return alert('No claims to export.');
        const ws = XLSX.utils.json_to_sheet(filteredClaims);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Claims");
        XLSX.writeFile(wb, `Hospital_Claims_${new Date().toISOString().slice(0, 10)}.csv`);
      };

      // Export to Excel (.xlsx)
      const handleExportXLSX = () => {
        if (filteredClaims.length === 0) return alert('No claims to export.');
        const ws = XLSX.utils.json_to_sheet(filteredClaims);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Claims_Data");
        XLSX.writeFile(wb, `Hospital_Claims_${new Date().toISOString().slice(0, 10)}.xlsx`);
      };

      // Import Excel/CSV
      const handleImportFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const bstr = evt.target.result;
            const wb = XLSX.read(bstr, { type: 'binary' });
            const wsname = wb.SheetNames[0];
            const ws = wb.Sheets[wsname];
            const data = XLSX.utils.sheet_to_json(ws);
            if (Array.isArray(data) && data.length > 0) {
              const mapped = data.map(item => ({
                patientName: item['Patient Details'] || item.patientName || item['Patient Name'] || '',
                uhid: item['UHID'] || item.uhid || '',
                mobileNumber: item['Mobile Number'] || item.mobileNumber || item.mobile || '',
                ipdNo: item['IPD No'] || item.ipdNo || '',
                doa: normalizeDateForStorage(item['DOA'] || item.doa || ''),
                dod: normalizeDateForStorage(item['DOD'] || item.dod || ''),
                tpaName: item['TPA/Ins. Name'] || item.tpaName || '',
                insuranceCompany: item['Insurance Company'] || item.insuranceCompany || '',
                insuranceID: item['Insurance ID'] || item.insuranceID || '',
                claimNo: item['Claim No'] || item.claimNo || '',
                policyNumber: item['Policy No'] || item.policyNumber || '',
                empID: item['EMP ID'] || item.empID || '',
                totalBill: String(item['Total Bill'] || item.totalBill || '0'),
                approved: String(item['Approved'] || item.approved || '0'),
                discount: String(item['Discount'] || item.discount || '0'),
                patientPay: String(item['Patient Pay'] || item.patientPay || '0'),
                deduction: String(item['Payment Recived'] || item.deduction || '0'),
                status: item['Status'] || item.status || 'Admitted',
                attenderName: item['Attender Name'] || item.attenderName || '',
                relation: item['Relation'] || item.relation || '',
                diagnosis: item['Diagnosis'] || item.diagnosis || '',
                surgeryName: item['Surgery Name'] || item.surgeryName || '',
                adminRemarks: item['Administrative Remarks'] || item.adminRemarks || item.remark || ''
              }));
              setClaims(mapped);
              alert(`✓ Successfully loaded ${mapped.length} records into the system!`);
            }
          } catch (err) {
            alert('Failed to parse file: ' + err.message);
          }
        };
        reader.readAsBinaryString(file);
      };

      // Save / Edit Claim
      const handleSaveClaim = (formClaim) => {
        if (claimToEdit !== null) {
          setClaims(prev => prev.map((c, i) => i === claimToEdit.index ? formClaim : c));
        } else {
          setClaims(prev => [formClaim, ...prev]);
        }
        setIsFormModalOpen(false);
        setClaimToEdit(null);

      const handleDeleteClaim = (index) => {

          setClaims(prev => prev.filter((_, i) => i !== index));

      return (

                    type="button"
                    onClick={() => handleStayIgnore(overduePatients[0])}
                    className={`px-2.5 py-1.5 rounded-lg font-extrabold text-[10px] cursor-pointer uppercase tracking-wider border ${
                      themeMode === 'light'
                        ? 'bg-white hover:bg-slate-100 text-slate-800 border-slate-300'
                        : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-600'
                    }`}
                  >
                    ⏰ Ignore
                  </button>
                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      onClick={() => handleStaySend(overduePatients[0], false)}
                      className="px-3 py-1.5 rounded-lg font-black text-[10px] bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-xs cursor-pointer uppercase tracking-wider"
                    >
                      ✓ Send
                    </button>
                    <button
                      type="button"
                      onClick={() => handleStaySend(overduePatients[0], true)}
                      className="px-2.5 py-1.5 rounded-lg font-extrabold text-[10px] bg-emerald-600 hover:bg-emerald-500 text-white shadow-xs cursor-pointer uppercase tracking-wider"
                    >
                      WhatsApp
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* --- CLAIM DOSSIER DETAILS MODAL --- */}
          {detailsClaim && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn overflow-y-auto">
              <div className="bg-[#0F172A] border-2 border-indigo-500/50 rounded-2xl shadow-2xl max-w-3xl w-full text-slate-200 p-6 space-y-4 animate-scaleUp">
                <div className="flex items-center justify-between border-b border-indigo-500/30 pb-3">
                  <div>
                    <span className="text-[10px] uppercase font-bold text-indigo-400 tracking-wider">Official Insurance Record</span>
                    <h3 className="text-lg font-black text-white">CLAIM DOSSIER DETAILS</h3>
                  </div>
                  <button type="button" onClick={() => setDetailsClaim(null)} className="w-8 h-8 rounded-lg bg-white/10 text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                {/* BOLD PATIENT DEMOGRAPHICS */}
                <div className="bg-slate-900/90 p-4 rounded-xl border border-white/10 space-y-2">
                  <div className="text-xs font-black text-indigo-300 uppercase tracking-wider">PATIENT DEMOGRAPHICS</div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">PATIENT NAME:</span>
                      <strong className="text-base font-black text-white tracking-tight">{detailsClaim.patientName}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">UHID:</span>
                      <strong className="text-sm font-black text-amber-300 font-mono">{detailsClaim.uhid || '-'}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">IPD NO:</span>
                      <strong className="text-sm font-black text-slate-200 font-mono">{detailsClaim.ipdNo || '-'}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">MOBILE NUMBER:</span>
                      <strong className="text-sm font-black text-emerald-400 font-mono">{detailsClaim.mobileNumber || '-'}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">ATTENDER NAME:</span>
                      <strong className="text-sm font-black text-slate-200">{detailsClaim.attenderName || '-'}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">RELATION:</span>
                      <strong className="text-sm font-black text-slate-200">{detailsClaim.relation || '-'}</strong>
                    </div>
                  </div>
                </div>

                {/* BOLD POLICY & INSURANCE METADATA */}
                <div className="bg-slate-900/90 p-4 rounded-xl border border-white/10 space-y-2">
                  <div className="text-xs font-black text-teal-300 uppercase tracking-wider">POLICY, INSURANCE & TPA METADATA</div>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">EMPLOYEE ID:</span>
                      <strong className="text-sm font-black text-slate-200 font-mono">{detailsClaim.empID || '-'}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">CLAIM NUMBER:</span>
                      <strong className="text-sm font-black text-indigo-300 font-mono">{detailsClaim.claimNo || '-'}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">POLICY NUMBER:</span>
                      <strong className="text-sm font-black text-slate-200 font-mono">{detailsClaim.policyNumber || '-'}</strong>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px] block uppercase">INSURANCE ID / MEMBER ID:</span>
                      <strong className="text-sm font-black text-slate-200 font-mono">{detailsClaim.insuranceID || '-'}</strong>
                    </div>
                    <div className="col-span-2">
                      <span className="text-slate-400 text-[10px] block uppercase">TPA / INS. NAME:</span>
                      <strong className="text-sm font-black text-white">{detailsClaim.tpaName || detailsClaim.insuranceCompany || '-'}</strong>
                    </div>
                  </div>
                </div>

                {/* ADMINISTRATIVE REMARKS */}
                <div className="bg-slate-900/90 p-4 rounded-xl border border-white/10 space-y-1">
                  <div className="text-xs font-black text-amber-400 uppercase tracking-wider">ADMINISTRATIVE REMARKS</div>
                  <p className="text-xs text-slate-300 whitespace-pre-wrap leading-relaxed">{detailsClaim.adminRemarks || detailsClaim.remark || 'No administrative remarks logged for this case.'}</p>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => window.print()} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl cursor-pointer">
                    🖨️ Print Dossier
                  </button>
                  <button type="button" onClick={() => setDetailsClaim(null)} className="px-4 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl cursor-pointer">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- ADD / EDIT CLAIM MODAL --- */}
          {isFormModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn overflow-y-auto">
              <div className="bg-[#0F172A] border border-white/10 rounded-2xl shadow-2xl max-w-2xl w-full text-slate-200 p-6 space-y-4 animate-scaleUp">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <h3 className="text-base font-bold text-white">{claimToEdit ? 'Edit Claim Record' : 'Add New Insurance Claim'}</h3>
                  <button type="button" onClick={() => setIsFormModalOpen(false)} className="w-8 h-8 rounded-lg bg-white/10 text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  const newObj = {
                    patientName: fd.get('patientName') || '',
                    uhid: fd.get('uhid') || '',
                    mobileNumber: fd.get('mobileNumber') || '',
                    ipdNo: fd.get('ipdNo') || '',
                    doa: normalizeDateForStorage(fd.get('doa')),
                    dod: normalizeDateForStorage(fd.get('dod')),
                    tpaName: fd.get('tpaName') || '',
                    insuranceCompany: fd.get('insuranceCompany') || '',
                    insuranceID: fd.get('insuranceID') || '',
                    claimNo: fd.get('claimNo') || '',
                    policyNumber: fd.get('policyNumber') || '',
                    empID: fd.get('empID') || '',
                    totalBill: String(fd.get('totalBill') || '0'),
                    approved: String(fd.get('approved') || '0'),
                    discount: String(fd.get('discount') || '0'),
                    patientPay: String(fd.get('patientPay') || '0'),
                    deduction: String(fd.get('deduction') || '0'),
                    status: fd.get('status') || 'Admitted',
                    attenderName: fd.get('attenderName') || '',
                    relation: fd.get('relation') || 'Self',
                    diagnosis: fd.get('diagnosis') || '',
                    surgeryName: fd.get('surgeryName') || '',
                    adminRemarks: fd.get('adminRemarks') || ''
                  };
                  handleSaveClaim(newObj);
                }} className="space-y-3">
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Patient Name *</label>
                      <input name="patientName" defaultValue={claimToEdit?.claim?.patientName || ''} required className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">UHID *</label>
                      <input name="uhid" defaultValue={claimToEdit?.claim?.uhid || ''} required className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Mobile Number</label>
                      <input name="mobileNumber" defaultValue={claimToEdit?.claim?.mobileNumber || ''} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">IPD No</label>
                      <input name="ipdNo" defaultValue={claimToEdit?.claim?.ipdNo || ''} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">DOA (Date of Admission)</label>
                      <input type="date" name="doa" defaultValue={normalizeDateForStorage(claimToEdit?.claim?.doa) || ''} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">DOD (Date of Discharge)</label>
                      <input type="date" name="dod" defaultValue={normalizeDateForStorage(claimToEdit?.claim?.dod) || ''} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">TPA Name</label>
                      <input name="tpaName" defaultValue={claimToEdit?.claim?.tpaName || ''} list="tpaList" className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white" />
                      <datalist id="tpaList">{TPA_OPTIONS.map((t, i) => <option key={i} value={t} />)}</datalist>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Claim Number</label>
                      <input name="claimNo" defaultValue={claimToEdit?.claim?.claimNo || ''} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Total Bill (₹)</label>
                      <input type="number" name="totalBill" defaultValue={claimToEdit?.claim?.totalBill || '0'} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Approved Amount (₹)</label>
                      <input type="number" name="approved" defaultValue={claimToEdit?.claim?.approved || '0'} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Status</label>
                      <select name="status" defaultValue={claimToEdit?.claim?.status || 'Admitted'} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white">
                        <option value="Admitted">Admitted</option>
                        <option value="Initial Approved">Initial Approved</option>
                        <option value="Discharge">Discharge</option>
                        <option value="Discharge Approved">Discharge Approved</option>
                        <option value="Settled">Settled</option>
                        <option value="Denial">Denial</option>
                        <option value="Pending">Pending</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1 font-bold">Attender Name & Relation</label>
                      <div className="flex gap-1">
                        <input name="attenderName" placeholder="Attender" defaultValue={claimToEdit?.claim?.attenderName || ''} className="w-2/3 bg-[#08080A] border border-white/10 rounded-lg p-2 text-white" />
                        <select name="relation" defaultValue={claimToEdit?.claim?.relation || 'Self'} className="w-1/3 bg-[#08080A] border border-white/10 rounded-lg p-2 text-white">
                          {RELATIONS.map((r, i) => <option key={i} value={r}>{r}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="col-span-2">
                      <label className="block text-slate-400 mb-1 font-bold">Administrative Remarks</label>
                      <textarea name="adminRemarks" rows="2" defaultValue={claimToEdit?.claim?.adminRemarks || ''} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white" placeholder="Enter administrative notes, interim updates, etc."></textarea>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setIsFormModalOpen(false)} className="px-4 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl cursor-pointer">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl cursor-pointer">Save Record</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- ADDRESS DETAILS MODAL --- */}
          {showAddressModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn overflow-y-auto">
              <div className="bg-[#0F172A] border border-teal-500/40 rounded-2xl shadow-2xl max-w-4xl w-full text-slate-200 p-6 space-y-4 animate-scaleUp">
                <div className="flex items-center justify-between border-b border-teal-500/30 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📍</span>
                    <h3 className="text-base font-bold text-white">TPA & Insurance Address Directory</h3>
                  </div>
                  <button type="button" onClick={() => setShowAddressModal(false)} className="w-8 h-8 rounded-lg bg-white/10 text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="max-h-96 overflow-y-auto space-y-3 pr-1">
                  {Object.entries(TPA_INSURANCE_ADDRESSES).map(([tpa, addr], idx) => (
                    <div key={idx} className="bg-slate-900/90 p-3 rounded-xl border border-white/5 space-y-1">
                      <div className="font-black text-sm text-teal-300">{tpa}</div>
                      <p className="text-xs text-slate-300 leading-relaxed">{addr}</p>
                    </div>
                  ))}
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-white/10">
                  <button type="button" onClick={() => window.print()} className="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs rounded-xl cursor-pointer">
                    🖨️ Print Address Directory
                  </button>
                  <button type="button" onClick={() => setShowAddressModal(false)} className="px-4 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl cursor-pointer">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- INVOICE CALCULATOR MODAL --- */}
          {showInvoiceCalc && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-[#0F172A] border border-purple-500/40 rounded-2xl shadow-2xl max-w-md w-full text-slate-200 p-6 space-y-4 animate-scaleUp">
                <div className="flex items-center justify-between border-b border-purple-500/30 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🧮</span>
                    <h3 className="text-base font-bold text-white">Interactive Invoice Calculator</h3>
                  </div>
                  <button type="button" onClick={() => setShowInvoiceCalc(false)} className="w-8 h-8 rounded-lg bg-white/10 text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <InvoiceCalcBody />
              </div>
            </div>
          )}

          {/* --- COVER LETTER MODAL --- */}
          {showCoverLetterModal && coverLetterClaim && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn overflow-y-auto">
              <div className="bg-[#0F172A] border border-teal-500/40 rounded-2xl shadow-2xl max-w-2xl w-full text-slate-200 p-6 space-y-4 animate-scaleUp">
                <div className="flex items-center justify-between border-b border-teal-500/30 pb-3">
                  <h3 className="text-base font-bold text-white">Cover Letter Preview</h3>
                  <button type="button" onClick={() => setShowCoverLetterModal(false)} className="w-8 h-8 rounded-lg bg-white/10 text-slate-400 hover:text-white font-bold">✕</button>
                </div>

                <div className="bg-white text-slate-900 p-6 rounded-xl space-y-4 text-xs font-serif leading-relaxed shadow-inner">
                  <div className="text-center border-b pb-2">
                    <h2 className="font-bold text-base">ARPA MEDCITY HOSPITAL & RESEARCH INSTITUTE</h2>
                    <p className="text-[10px] text-slate-600">Insurance & TPA Claims Department</p>
                  </div>
                  <div>
                    <p><strong>To:</strong> The Claims Manager, {coverLetterClaim.tpaName || coverLetterClaim.insuranceCompany}</p>
                    <p><strong>Date:</strong> {new Date().toLocaleDateString('en-IN')}</p>
                  </div>
                  <div>
                    <p><strong>Subject:</strong> Submission of Final Bill & Claim Documents for Patient {coverLetterClaim.patientName}</p>
                  </div>
                  <p>Dear Sir/Madam,</p>
                  <p>We are forwarding herewith the complete medical file, discharge summary, running bill, and original investigation reports for the following patient:</p>
                  <ul className="list-disc pl-5 space-y-1">
                    <li><strong>Patient Name:</strong> {coverLetterClaim.patientName}</li>
                    <li><strong>UHID / IPD:</strong> {coverLetterClaim.uhid} / {coverLetterClaim.ipdNo}</li>
                    <li><strong>Claim Number:</strong> {coverLetterClaim.claimNo}</li>
                    <li><strong>Policy Number:</strong> {coverLetterClaim.policyNumber}</li>
                    <li><strong>Admission Date:</strong> {formatDateForDisplay(coverLetterClaim.doa)}</li>
                    <li><strong>Total Claim Amount:</strong> ₹ {coverLetterClaim.totalBill}</li>
                  </ul>
                  <p>Kindly process the settlement at the earliest.</p>
                  <div className="pt-4">
                    <p>Authorized Signatory,</p>
                    <p><strong>Arpa Medcity Hospital</strong></p>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => window.print()} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl cursor-pointer">
                    🖨️ Print Letter
                  </button>
                  <button type="button" onClick={() => setShowCoverLetterModal(false)} className="px-4 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl cursor-pointer">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function InvoiceCalcBody() {
      const [bill, setBill] = useState(50000);
      const [approved, setApproved] = useState(40000);
      const [discount, setDiscount] = useState(2000);
      const [tdsPct, setTdsPct] = useState(10);

      const netPayable = Math.max(0, approved - (approved * (tdsPct / 100)));
      const patientShare = Math.max(0, bill - approved - discount);

      return (
        <div className="space-y-3 text-xs">
          <div>
            <label className="block text-slate-400 mb-1">Total Bill Amount (₹)</label>
            <input type="number" value={bill} onChange={e => setBill(Number(e.target.value))} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
          </div>
          <div>
            <label className="block text-slate-400 mb-1">Insurance Approved Amount (₹)</label>
            <input type="number" value={approved} onChange={e => setApproved(Number(e.target.value))} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
          </div>
          <div>
            <label className="block text-slate-400 mb-1">Hospital Discount (₹)</label>
            <input type="number" value={discount} onChange={e => setDiscount(Number(e.target.value))} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
          </div>
          <div>
            <label className="block text-slate-400 mb-1">TDS Percentage (%)</label>
            <input type="number" value={tdsPct} onChange={e => setTdsPct(Number(e.target.value))} className="w-full bg-[#08080A] border border-white/10 rounded-lg p-2 text-white font-mono" />
          </div>

          <div className="bg-slate-900/90 p-3 rounded-xl border border-white/5 space-y-1.5 mt-2">
            <div className="flex justify-between">
              <span className="text-slate-400">Net Hospital Receivable (Post TDS):</span>
              <strong className="text-emerald-300 font-mono">₹ {netPayable.toLocaleString('en-IN')}</strong>
            </div>
            <div className="flex justify-between">
              <span className="text-slate-400">Patient Co-Pay / Balance:</span>
              <strong className="text-amber-300 font-mono">₹ {patientShare.toLocaleString('en-IN')}</strong>
            </div>
          </div>
        </div>
      );
    }

    // Render the React application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
